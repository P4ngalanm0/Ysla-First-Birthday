<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amara Ysla's 1st Birthday!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Modal */
        #modalOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.3s;
        }

        #modalOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .modal-content {
            background: #1e1e2f;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 2px solid #00b4d8;
        }

        .modal-btn {
            background: #00b4d8;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        /* Main Container */
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* Interactive Eye */
        .eye-container {
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 4px solid #6b21a8;
        }

        .pupil {
            width: 40px;
            height: 40px;
            background: #00b4d8;
            border-radius: 50%;
            position: absolute;
            transition: transform 0.1s ease-out;
        }

        .pupil::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: #000;
            border-radius: 50%;
            top: 12.5px;
            left: 12.5px;
        }

        /* NPC Box */
        .npc-box {
            background: #2a2a40;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 5px solid #ccff00;
            display: none;
        }

        .npc-box.show {
            display: block;
        }

        /* Scream Canister */
        .canister-container {
            width: 100%;
            background: #333;
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            margin: 15px 0;
            border: 2px solid #555;
        }

        .canister-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #ccff00);
            transition: width 0.2s;
        }

        /* Buttons */
        .action-btn {
            background: #ccff00;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        /* Rocket */
        .rocket-container {
            font-size: 50px;
            margin: 20px 0;
            display: inline-block;
        }

        .rocket-container.launching {
            animation: launchAnim 24s forwards ease-in-out;
        }

        @keyframes launchAnim {
            0% { transform: translateY(0) scale(1); }
            10% { transform: translateY(-20px) scale(1.1); }
            50% { transform: translateY(-400px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Intro Modal -->
    <div id="modalOverlay">
        <div class="modal-content">
            <h2>Welcome to the Party! 🎉</h2>
            <p>Tap below to enable sound and join Amara Ysla's celebration!</p>
            <button class="modal-btn" onclick="closeIntroModal()">Enter Party</button>
        </div>
    </div>

    <div class="container">
        <h1>Amara Ysla's 1st Birthday 🎂</h1>

        <div class="eye-container">
            <div id="pupil" class="pupil"></div>
        </div>

        <div id="npcBox" class="npc-box">
            <p id="npcText">...</p>
        </div>

        <div class="canister-container">
            <div id="canisterBar" class="canister-bar"></div>
        </div>
        <p>Scream Energy: <span id="screampct">0%</span></p>

        <button class="action-btn" onclick="chargeScreamCanister()">Fill Canister ⚡</button>
        <button id="showcaseBtn" class="action-btn" onclick="triggerMonsterNPC()">Start Rocket Show 🚀</button>

        <div>
            <div id="rocketContainer" class="rocket-container">🚀</div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        // Synchronously create/unlock AudioContext on first touch
        function unlockAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // Mobile iOS session type configuration
            if (navigator.audioSession) {
                navigator.audioSession.type = 'playback';
            }

            // Clean up listeners after first successful interaction
            document.removeEventListener('touchstart', unlockAudio);
            document.removeEventListener('touchend', unlockAudio);
            document.removeEventListener('click', unlockAudio);
        }

        document.addEventListener('touchstart', unlockAudio, { capture: true, once: true });
        document.addEventListener('touchend', unlockAudio, { capture: true, once: true });
        document.addEventListener('click', unlockAudio, { capture: true, once: true });

        function ensureAudioReady() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function closeIntroModal() {
            ensureAudioReady();
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.add('hidden');
        }

        function playChargeSound(pitchMultiplier = 1) {
            ensureAudioReady();
            if (!audioCtx || audioCtx.state !== 'running') return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300 * pitchMultiplier, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600 * pitchMultiplier, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playRoarSound() {
            ensureAudioReady();
            if (!audioCtx || audioCtx.state !== 'running') return;

            const now = audioCtx.currentTime;

            const funOsc = audioCtx.createOscillator();
            const funGain = audioCtx.createGain();

            funOsc.type = 'triangle';
            funOsc.frequency.setValueAtTime(523.25, now);
            funOsc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);

            funGain.gain.setValueAtTime(0.25, now);
            funGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

            funOsc.connect(funGain);
            funGain.connect(audioCtx.destination);

            const roarOsc = audioCtx.createOscillator();
            roarOsc.type = 'sawtooth';
            roarOsc.frequency.setValueAtTime(220, now);
            roarOsc.frequency.exponentialRampToValueAtTime(90, now + 0.7);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(400, now + 0.7);

            const bufferSize = audioCtx.sampleRate * 0.7;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(600, now);
            noiseFilter.Q.setValueAtTime(2, now);

            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.35, now);
            masterGain.gain.exponentialRampToValueAtTime(0.01, now + 0.75);

            roarOsc.connect(filter);
            filter.connect(masterGain);

            noise.connect(noiseFilter);
            noiseFilter.connect(masterGain);

            masterGain.connect(audioCtx.destination);

            funOsc.start(now);
            roarOsc.start(now);
            noise.start(now);

            funOsc.stop(now + 0.5);
            roarOsc.stop(now + 0.75);
            noise.stop(now + 0.75);
        }

        function playLaunchSound() {
            ensureAudioReady();
            if (!audioCtx || audioCtx.state !== 'running') return;

            const bufferSize = audioCtx.sampleRate * 1.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(200, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 1);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        const monsterMessages = [
            "Hello! Thanks for coming to Amara's 1st Birthday!",
            "ROAR! Another awesome monster joined!",
            "Yay! Let's start the rocket show!",
            "Welcome! Ready for launch!"
        ];

        function triggerMonsterNPC() {
            ensureAudioReady();
            const btn = document.getElementById('showcaseBtn');
            const npcBox = document.getElementById('npcBox');
            const npcText = document.getElementById('npcText');

            btn.disabled = true;

            const randomMsg = monsterMessages[Math.floor(Math.random() * monsterMessages.length)];
            npcText.innerText = randomMsg;

            npcBox.classList.add('show');
            playChargeSound(1.2);

            setTimeout(() => {
                npcBox.classList.remove('show');
                startLaunchSequence();
            }, 4000);
        }

        function startLaunchSequence() {
            const btn = document.getElementById('showcaseBtn');
            const rocket = document.getElementById('rocketContainer');
            
            let countdown = 1;
            btn.innerText = `Launching in ${countdown}... 🚀`;
            
            const timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    btn.innerText = `Launching in ${countdown}... 🚀`;
                } else {
                    clearInterval(timer);
                    btn.innerText = "LIFTOFF! 💥";

                    playLaunchSound();

                    if (typeof confetti === 'function') {
                        confetti({
                            particleCount: 120,
                            spread: 80,
                            origin: { y: 0.6 },
                            colors: ['#ccff00', '#00b4d8', '#ff007f', '#6b21a8']
                        });
                    }
                    
                    rocket.classList.remove('launching');
                    void rocket.offsetWidth; 
                    rocket.classList.add('launching');

                    setTimeout(() => {
                        rocket.classList.remove('launching');
                        btn.innerText = "Replay Amara's Journey! 🚀";
                        btn.disabled = false;
                    }, 24000);
                }
            }, 1000);
        }

        let energy = 0;
        function chargeScreamCanister() {
            ensureAudioReady();
            if (energy < 100) {
                energy += 10;
                document.getElementById('screampct').innerText = energy + '%';
                document.getElementById('canisterBar').style.width = energy + '%';
                playChargeSound(1 + (energy / 100));
            }
            
            if (energy === 100) {
                playRoarSound();
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 60, spread: 70, origin: { y: 0.8 } });
                }
            }
        }

        function updatePupilPosition(clientX, clientY) {
            const pupil = document.getElementById('pupil');
            if (!pupil) return;
            const rect = pupil.getBoundingClientRect();
            const x = (clientX - rect.left - rect.width / 2) / 12;
            const y = (clientY - rect.top - rect.height / 2) / 12;
            pupil.style.transform = `translate(${Math.max(-10, Math.min(10, x))}px, ${Math.max(-10, Math.min(10, y))}px)`;
        }

        document.addEventListener('mousemove', (e) => {
            updatePupilPosition(e.clientX, e.clientY);
        });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updatePupilPosition(e.touches[0].clientX, e.touches[0].clientY);
            }
        });
    </script>
</body>
</html>
